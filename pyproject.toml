[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistant"
version = "0.1.0"
description = "Knowledge-base assistant (RAG): answers strictly from your documents with sources. SQLite FTS5 search, Claude API with citations, Telegram bot and CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Shokun", email = "sonoyumiii@gmail.com" }]
dependencies = [
    "anthropic>=1.0,<2",
    "aiogram>=3.13,<4",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/sonoyumi/rag-assistant"

[project.scripts]
rag-assistant = "rag_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
